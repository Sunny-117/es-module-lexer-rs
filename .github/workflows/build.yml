name: Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  APP_NAME: es-module-lexer-rs-native

jobs:
  build:
    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # Linux x64
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: |
              cd packages/es-module-lexer-rs
              pnpm build:rust --target x86_64-unknown-linux-gnu
            
          # Linux ARM64
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: |
              cd packages/es-module-lexer-rs
              sudo apt-get update
              sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
              pnpm build:rust --target aarch64-unknown-linux-gnu
            
          # macOS x64
          - host: macos-latest
            target: x86_64-apple-darwin
            build: |
              cd packages/es-module-lexer-rs
              pnpm build:rust --target x86_64-apple-darwin
            
          # macOS ARM64 (Apple Silicon)
          - host: macos-latest
            target: aarch64-apple-darwin
            build: |
              cd packages/es-module-lexer-rs
              pnpm build:rust --target aarch64-apple-darwin
            
          # Windows x64
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: |
              cd packages/es-module-lexer-rs
              pnpm build:rust --target x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/es-module-lexer-rs/*.node
          if-no-files-found: error

  build-freebsd:
    name: Build - x86_64-unknown-freebsd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build in FreeBSD
        uses: cross-platform-actions/action@v0.23.0
        env:
          DEBUG: napi:*
          RUSTUP_IO_THREADS: 1
        with:
          operating_system: freebsd
          version: '13.2'
          memory: 8G
          cpu_count: 3
          shell: bash
          run: |
            sudo pkg install -y -f curl node libnghttp2 npm
            sudo npm install -g pnpm
            curl https://sh.rustup.rs -sSf --output rustup.sh
            sh rustup.sh -y --profile minimal --default-toolchain stable
            source "$HOME/.cargo/env"
            cd packages/es-module-lexer-rs
            pnpm build:rust --target x86_64-unknown-freebsd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-x86_64-unknown-freebsd
          path: packages/es-module-lexer-rs/*.node
          if-no-files-found: error

  test-bindings:
    name: Test bindings - ${{ matrix.settings.target }}
    needs: build
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/es-module-lexer-rs

      - name: List packages
        run: ls -R packages/es-module-lexer-rs
        shell: bash

      - name: Build TypeScript
        run: |
          cd packages/es-module-lexer-rs
          pnpm build:ts

      - name: Test bindings
        run: |
          cd packages/es-module-lexer-rs
          pnpm test

  universal-macOS:
    name: Build universal macOS binary
    needs: build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-apple-darwin
          path: packages/es-module-lexer-rs/artifacts/x64

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-aarch64-apple-darwin
          path: packages/es-module-lexer-rs/artifacts/arm64

      - name: Create universal binary
        run: |
          cd packages/es-module-lexer-rs
          lipo -create \
            artifacts/x64/*.node \
            artifacts/arm64/*.node \
            -output es-module-lexer-rs-native.darwin-universal.node

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-universal-apple-darwin
          path: packages/es-module-lexer-rs/*.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs:
      - test-bindings
      - universal-macOS
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages/es-module-lexer-rs/artifacts

      - name: Move artifacts
        run: |
          cd packages/es-module-lexer-rs
          for dir in artifacts/bindings-*; do
            if [ -d "$dir" ]; then
              cp "$dir"/*.node . 2>/dev/null || true
            fi
          done
          ls -la *.node

      - name: Build TypeScript
        run: |
          cd packages/es-module-lexer-rs
          pnpm build:ts

      - name: Publish to npm
        run: |
          cd packages/es-module-lexer-rs
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
